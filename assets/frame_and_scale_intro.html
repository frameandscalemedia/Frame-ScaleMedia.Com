<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frame & Scale Media — Intro</title>
<style>
  :root{
    --navy-deep:#081426;
    --navy:#0b1c36;
    --navy-line:#3a5170;
    --gold:#c9a876;
    --white:#f5f3ee;
  }
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:900px;height:900px;
    max-width:100vw;max-height:100vw;
    background:radial-gradient(circle at 50% 42%, var(--navy) 0%, var(--navy-deep) 75%);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  /* --- corner brackets (viewfinder) --- */
  .bracket{
    position:absolute;
    width:70px;height:70px;
    border:2px solid var(--navy-line);
    opacity:0;
  }
  .bracket.tl{top:50%;left:50%;border-right:none;border-bottom:none;
    transform:translate(-260px,-260px) scale(1.6);}
  .bracket.tr{top:50%;left:50%;border-left:none;border-bottom:none;
    transform:translate(190px,-260px) scale(1.6);}
  .bracket.bl{top:50%;left:50%;border-right:none;border-top:none;
    transform:translate(-260px,190px) scale(1.6);}
  .bracket.br{top:50%;left:50%;border-left:none;border-top:none;
    transform:translate(190px,190px) scale(1.6);}

  .bracket.tl{animation: snap-tl 1.8s cubic-bezier(.2,.9,.25,1) 0.3s infinite, hold-fade 1s ease 5s infinite;}
  .bracket.tr{animation: snap-tr 1.8s cubic-bezier(.2,.9,.25,1) 0.5s infinite, hold-fade 1s ease 5s infinite;}
  .bracket.bl{animation: snap-bl 1.8s cubic-bezier(.2,.9,.25,1) 0.5s infinite, hold-fade 1s ease 5s infinite;}
  .bracket.br{animation: snap-br 1.8s cubic-bezier(.2,.9,.25,1) 0.3s infinite, hold-fade 1s ease 5s infinite;}

  @keyframes snap-tl{
    0%{opacity:0; transform:translate(-420px,-420px) scale(2.2);}
    60%{opacity:1;}
    100%{opacity:1; transform:translate(-150px,-150px) scale(1);}
  }
  @keyframes snap-tr{
    0%{opacity:0; transform:translate(350px,-420px) scale(2.2);}
    60%{opacity:1;}
    100%{opacity:1; transform:translate(80px,-150px) scale(1);}
  }
  @keyframes snap-bl{
    0%{opacity:0; transform:translate(-420px,350px) scale(2.2);}
    60%{opacity:1;}
    100%{opacity:1; transform:translate(-150px,80px) scale(1);}
  }
  @keyframes snap-br{
    0%{opacity:0; transform:translate(350px,350px) scale(2.2);}
    60%{opacity:1;}
    100%{opacity:1; transform:translate(80px,80px) scale(1);}
  }
  @keyframes hold-fade{
    to{opacity:0;}
  }

  /* --- thin rotating frame ring, echoes the two squares in the logo mark --- */
  .ring{
    position:absolute;
    width:340px;height:340px;
    border:1px solid var(--navy-line);
    opacity:0;
    animation: ring-in 2s ease 1.8s infinite, ring-fade 1.2s ease 4.8s infinite;
  }
  @keyframes ring-in{
    0%{opacity:0; transform:scale(0.7) rotate(-6deg);}
    100%{opacity:0.55; transform:scale(1) rotate(0deg);}
  }
  @keyframes ring-fade{ to{opacity:0; transform:scale(1.15) rotate(2deg);} }

  /* --- logo lockup --- */
  .lockup{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    opacity:0;
    animation: logo-in 1.8s cubic-bezier(.2,.8,.2,1) 2.2s infinite;
  }
  @keyframes logo-in{
    0%{opacity:0; transform:scale(0.9);}
    100%{opacity:1; transform:scale(1);}
  }

  .logo-img{
    width:420px;
    max-width:70vw;
    display:block;
  }

  .tag-underline{
    width:0%;
    height:1px;
    background:var(--gold);
    margin-top:2px;
    animation: draw-line 1.4s ease 4.0s infinite;
  }
  @keyframes draw-line{ to{ width:230px; } }
</style>
</head>

    <div class="ring"></div>
    <div class="lockup">
