<style>
  :root{
    --ink:#091b34; --gold:#C89B3C; --gold-bright:#a88d5c; --paper:#F7F4EE;
    --white:#ffffff; --text-light:#ffffff; --text-muted:#b3b8bf; --max:1120px;
    --display:'Bebas Neue',sans-serif; --body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;font-family:var(--body);color:var(--text-light);background:var(--ink);
    line-height:1.6;-webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;padding:24px;
    position:relative;overflow:hidden;
  }
  body::before{
    content:"";position:absolute;width:900px;height:900px;border-radius:50%;
    right:-320px;top:-360px;background:radial-gradient(circle,rgba(200,155,60,.16),transparent 68%);
    pointer-events:none;
  }
  .wrap{max-width:560px;text-align:center;position:relative;z-index:1;}
  .mark{margin:0 auto 28px;width:64px;height:64px;}
  .code{
    font-family:var(--display);font-weight:400;letter-spacing:.02em;
    font-size:clamp(64px,14vw,120px);color:var(--gold);line-height:1;margin:0;
  }
  h1{
    font-family:var(--display);font-weight:400;letter-spacing:.01em;
    font-size:clamp(28px,5vw,42px);margin:10px 0 16px;line-height:1.05;
  }
  p{color:var(--text-muted);font-size:16.5px;max-width:44ch;margin:0 auto 32px;}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{
    font-family:var(--mono);font-size:13px;letter-spacing:.04em;padding:13px 22px;
    border-radius:2px;text-decoration:none;display:inline-block;border:1px solid transparent;
    transition:transform .2s ease, background .2s ease, color .2s ease;
  }
  .btn--gold{background:var(--gold);color:var(--ink);}
  .btn--gold:hover{background:var(--gold-bright);transform:translateY(-2px);}
  .btn--outline{border-color:rgba(255,255,255,.4);color:var(--text-light);}
  .btn--outline:hover{border-color:var(--gold);color:var(--gold);}
  @media (max-width:480px){ .actions{flex-direction:column;} .btn{width:100%;text-align:center;} }
</style>
</head>

    </div>
  </div>
</body>
